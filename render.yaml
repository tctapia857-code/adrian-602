services:
  - type: web
    name: api-productos-adrian
    runtime: node
    plan: free
    branch: codex/postgres-render
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-postgres
          property: connectionString

databases:
  - name: inventario-postgres
    plan: free
    databaseName: inventario
    user: inventario
    postgresMajorVersion: "17"
    ipAllowList: []
